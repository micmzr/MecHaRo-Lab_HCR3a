controller_manager:
  ros__parameters:
    update_rate: 20  # Hz

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController 

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    forward_command_controller_position:
      type: forward_command_controller/ForwardCommandController

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    net_ft_diagnostic_broadcaster:
      type: net_ft_diagnostic_broadcaster/NetFTDiagnosticBroadcaster      

    gpio_controller:
      type: gpio_controllers/GpioCommandController
      
joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 20.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.05
      joint1: {trajectory: 0.1, goal: 0.1}
      joint2: {trajectory: 0.1, goal: 0.1}
      joint3: {trajectory: 0.1, goal: 0.1}
      joint4: {trajectory: 0.1, goal: 0.1}
      joint5: {trajectory: 0.1, goal: 0.1}
      joint6: {trajectory: 0.1, goal: 0.1}
    stop_trajectory_duration: 0.5

forward_command_controller_position:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6      
    interface_name: position

gpio_controller:
  ros__parameters:
    gpios:
      - IOs
    command_interfaces:
      IOs:
        - interfaces:
          - D0
          - D1
          - D2
          - D3
          - D4
          - D5
          - D6
          - D7
    state_interfaces:
      IOs:
        - interfaces:
          - D0
          - D1
          - D2
          - D3
          - D4
          - D5
          - D6
          - D7  

gripper_controller:
  ros__parameters:
    joints:
      - finger1
      # - finger2
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 100.0
    action_monitor_rate: 100.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.05
      finger1: {trajectory: 0.1, goal: 0.1}
      # finger2: {trajectory: 0.1, goal: 0.1}
    stop_trajectory_duration: 0.5

force_torque_sensor_broadcaster:
  ros__parameters:
    update_rate: 500  # Hz
    sensor_name: tcp_fts_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: forcesensor_Link
    topic_name: ft_data    
    
